name: sync-upstream

# Keeps the Plus layer on top of the newest MCA Selector core.
#
# master is a mirror of Querz/mcaselector and is fast-forwarded, plus is rebased on top of it.
# A clean rebase is pushed automatically; a conflicting one is reported as an issue so that
# nothing is ever force-pushed on top of a half-solved conflict.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: check out the plus branch with full history
        uses: actions/checkout@v4
        with:
          ref: plus
          fetch-depth: 0

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: fetch upstream
        run: |
          git remote add upstream https://github.com/Querz/mcaselector.git 2>/dev/null || git remote set-url upstream https://github.com/Querz/mcaselector.git
          git fetch upstream master --tags --prune

      - name: fast-forward the core branch
        id: core
        run: |
          # a fork tracks upstream/master and origin/master at once, a bare "git checkout master"
          # aborts with "matched multiple remote tracking branches", so pin the branch to upstream
          git checkout -B master upstream/master
          before=$(git rev-parse master)
          git merge --ff-only upstream/master
          if [ "$before" = "$(git rev-parse master)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git push origin master
          fi
          echo "version=$(grep -m1 '^version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: rebase the plus layer onto the new core
        id: rebase
        run: |
          git checkout -B plus origin/plus
          if git rebase master; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            git push --force-with-lease origin plus
          else
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      # a new core only reaches the users when there is a Plus release to update to: the in-app update
      # check reads this repository's latest release, and a release is only created by a plus-* tag.
      # Upstream's own tags stay untouched - tagging them here would publish a plain core release
      # that the Plus layer cannot update to.
      - name: tag the Plus release for the new core
        id: tag
        continue-on-error: true
        if: steps.rebase.outputs.conflict == 'false' && steps.core.outputs.changed == 'true'
        run: |
          plus=$(grep -m1 '^plus\.version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          core=$(git show master:gradle.properties | grep -m1 '^version=' | cut -d= -f2- | tr -d '\r')
          if [ -z "$plus" ] || [ -z "$core" ]; then
            echo "could not read the versions (core='$core', plus='$plus')" >&2
            exit 1
          fi
          tag="plus-$core-$plus"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists, nothing to release"
            exit 0
          fi
          git tag -a "$tag" -m "MCA Selector Plus $core - Plus $plus"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tagged and pushed $tag"

      - name: report the result
        if: always()
        env:
          CORE_CHANGED: ${{ steps.core.outputs.changed }}
          CORE_VERSION: ${{ steps.core.outputs.version }}
          CONFLICT: ${{ steps.rebase.outputs.conflict }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_TAGGED: ${{ steps.tag.outputs.created }}
        uses: actions/github-script@v7
        with:
          script: |
            const coreChanged = process.env.CORE_CHANGED === 'true';
            const conflict = process.env.CONFLICT === 'true';
            const coreVersion = process.env.CORE_VERSION || 'unknown';
            const releaseTag = process.env.RELEASE_TAG || '';
            const releaseTagged = process.env.RELEASE_TAGGED === 'true';
            if (conflict) {
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-sync'
              });
              if (existing.data.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `upstream sync needs a manual rebase (core ${coreVersion})`,
                  labels: ['upstream-sync'],
                  body: [
                    `The scheduled sync could not rebase \`plus\` onto upstream core **${coreVersion}**.`,
                    '',
                    'Nothing was pushed. Run `scripts/sync-upstream.sh` locally, resolve the conflicts and push the result, then close this issue.'
                  ].join('\n')
                });
              }
            } else if (coreChanged) {
              let text = `Rebased \`plus\` onto upstream core **${coreVersion}** and pushed it.`;
              if (releaseTagged) {
                text += ` Tagged \`${releaseTag}\`, the Release Plus workflow builds and publishes it.`;
              } else if (releaseTag) {
                text += ` Tag \`${releaseTag}\` already exists, so this core has been released before.`;
              }
              core.summary.addRaw(text);
            } else {
              core.summary.addRaw('Upstream had no new commits, nothing to do.');
            }
